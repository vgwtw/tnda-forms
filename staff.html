<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<title>TNDA 前導甄選 · 業師與主辦</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="entry.css">
</head>
<body>
<div class="app">
  <header class="bar dark">
    <div><div class="eyebrow" style="color:var(--tnda-orange)">TNDA 前導甄選　業師與主辦</div>
      <h1>選一天</h1></div>
  </header>
  <main class="body" style="padding-bottom:40px">
    <div class="note">
      現場的 QR Code 會直接帶你到<strong>當天</strong>的流程；這一頁是備援。
      要填的表單都在當日流程裡，<strong>送出後不能修改</strong>。<br>
      <strong>這一頁不要給學員</strong>——上面有評分規準與權重。
    </div>
    <div id="list"></div>

    <span class="label">工具</span>
    <!-- draw.html（擂台賽抽籤）還在，但 2026 這一場沒有擂台賽，所以不列出來。
         之後要辦的話：規模.json 的 Day1.擂台賽 改 true、跑 套用規模.py，
         再把下面這段取消註解。
    <a class="entry" href="draw.html">
      <div class="top"><span class="nm">擂台賽上場順序</span><span class="wt">DAY 1</span></div>
      <div class="sub">按一下抽出全場順序，投影用。守擂制，第 01 位先上</div>
    </a>
    -->
    <a class="entry" href="votes.html">
      <div class="top"><span class="nm">想玩投票 · 揭曉舞台</span><span class="wt">DAY 2</span></div>
      <div class="sub">投影用。點組別 → 揭曉，票數即時更新。只有彙總票數，沒有個資</div>
    </a>
    <a class="entry" href="dashboard.html">
      <div class="top"><span class="nm">統計儀表板</span><span class="wt">ANALYSIS</span></div>
      <div class="sub">收件狀況、加權總分、個人回饋摘要、編輯學生姓名、匯出。需要讀取金鑰</div>
    </a>
  </main>
</div>

<script src="config.js?v=2b648138"></script>
<script src="app.js?v=f12bffc2"></script>
<script>
(() => {
'use strict';
const T = window.TNDA, A = window.APP;
document.getElementById('list').innerHTML = Object.keys(T.SCHEDULE).map((d) => {
  const s = T.SCHEDULE[d];
  const forms = [].concat(...(s.blocks || []).map((b) => A.formsFor(b, 'mentor')))
    .filter((v, i, a) => a.indexOf(v) === i)
    .map((id) => T.FORMS[id].title).join('、');
  return '<a class="entry" href="run.html?day=' + encodeURIComponent(d) + '">' +
    '<div class="top"><span class="nm">DAY ' + d + '　' + A.esc(s.title) + '</span>' +
    '<span class="wt">' + A.esc(s.date) + '</span></div>' +
    '<div class="sub">' + (forms ? '要填：' + A.esc(forms) : '沒有要填的表單') + '</div></a>';
}).join('');
A.guard(document.querySelector('.app'));
A.nameNotice(document.querySelector('.app'));
A.syncNames().then(() => A.nameNotice(document.querySelector('.app')));
})();
</script>
</body>
</html>
