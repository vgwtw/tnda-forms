<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF4F2C">
<title>TNDA 前導甄選 · 學員</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="entry.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div><div class="eyebrow">TNDA 前導甄選　學員</div><h1>選一天</h1></div>
  </header>
  <main class="body" style="padding-bottom:40px">
    <div class="note">
      現場的 QR Code 會直接帶你到<strong>當天</strong>的行程；
      這一頁是備援，掃錯或想看另一天時用。<br>
      要填的表單都在當日行程裡，<strong>送出後不能修改</strong>。
    </div>
    <div id="list"></div>
  </main>
</div>

<script src="config.js?v=2b648138"></script>
<script src="app.js?v=f12bffc2"></script>
<script>
(() => {
'use strict';
const T = window.TNDA, A = window.APP;
document.getElementById('list').innerHTML = Object.keys(T.SCHEDULE).map((d) => {
  const s = T.SCHEDULE[d];
  const forms = [].concat(...(s.blocks || []).map((b) => A.formsFor(b, 'student')))
    .filter((v, i, a) => a.indexOf(v) === i)
    .map((id) => T.FORMS[id].title).join('、');
  return '<a class="entry" href="today.html?day=' + encodeURIComponent(d) + '">' +
    '<div class="top"><span class="nm">DAY ' + d + '　' + A.esc(s.title) + '</span>' +
    '<span class="wt">' + A.esc(s.date) + '</span></div>' +
    '<div class="sub">' + (forms ? '要填：' + A.esc(forms) : '沒有要填的表單') + '</div></a>';
}).join('');
A.guard(document.querySelector('.app'));
A.syncNames();   // 學員端不顯示「名單未載入」提示
})();
</script>
</body>
</html>
