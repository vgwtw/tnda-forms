<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>統計儀表板 · TNDA 前導甄選</title>
<link rel="stylesheet" href="app.css">
<style>
/* ── 儀表板專用外觀 ──────────────────────────────────────
   長時間盯著看的頁面，所以跟表單頁不同：深色底、髮絲線、
   橘色只留給圖表的主要數列，其餘一律灰階。切換淺色存在這台裝置。 */
:root{
  --bg:#131313; --rail:#0D0D0D; --s1:#1A1A1A; --s2:#232323;
  --line:#292929; --line2:#1F1F1F;
  --fg:#EAEAEA; --fg2:#9E9E9E; --fg3:#6B6B6B;
  --acc:var(--tnda-orange);
}
html[data-theme="light"]{
  --bg:#F4F4F4; --rail:#FFFFFF; --s1:#FFFFFF; --s2:#EDEDED;
  --line:#E0E0E0; --line2:#EDEDED;
  --fg:#141414; --fg2:#5A5A5A; --fg3:#8E8E8E;
}
body{background:var(--bg);color:var(--fg);font-size:15px}
a{color:var(--fg)}
a:hover{color:var(--acc)}
.shell{display:grid;grid-template-columns:216px 1fr;min-height:100dvh}

/* ── 左側導覽 ── */
aside.rail{background:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100dvh}
aside.rail .brand{padding:22px 20px 18px;border-bottom:1px solid var(--line2)}
aside.rail .brand .eyebrow{color:var(--fg3);letter-spacing:.2em;font-weight:400;font-size:9px}
aside.rail .brand h1{margin:7px 0 0;font:700 17px/1.3 var(--font-body)}
aside.rail .railfoot{padding:14px 20px 18px;border-top:1px solid var(--line2);
  font-size:11.5px;line-height:1.6;color:var(--fg3);display:grid;gap:10px;justify-items:start}
aside.rail .railfoot a{color:var(--fg2);border-bottom:1px solid var(--line)}
#theme{padding:6px 11px;border:1px solid var(--line);background:none;color:var(--fg2);font-size:11px}
#theme:hover{color:var(--fg);border-color:var(--fg3)}

nav.tabs{padding:12px 10px;display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto}
nav.tabs button{display:grid;grid-template-columns:3px 1fr;gap:10px;align-items:center;
  text-align:left;padding:9px 10px;color:var(--fg2);font:400 13.5px/1.35 var(--font-body)}
nav.tabs button::before{content:"";height:14px;background:transparent}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{background:var(--s2);color:var(--fg);font-weight:500}
nav.tabs button[aria-selected="true"]::before{background:var(--acc)}

main.main{min-width:0;padding:0 0 96px}
.wrap{max-width:1240px;padding:0 40px}
section.pane{padding-top:34px}

/* ── 標題與說明 ── */
h2.sec{font:500 15px/1.3 var(--font-body);letter-spacing:0;color:var(--fg);
  text-transform:none;margin:34px 0 0;padding-bottom:9px;border-bottom:1px solid var(--line)}
h2.sec:first-child{margin-top:0}
p.lede{font-size:12.5px;color:var(--fg2);margin:10px 0 16px;max-width:70ch;line-height:1.75}
p.lede b{color:var(--fg);font-weight:500}
.eyebrow{color:var(--fg3);letter-spacing:.2em;font-weight:400}

/* ── 區塊 ── */
.card{background:var(--s1);border:1px solid var(--line);padding:18px 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}

/* KPI：不做盒子，一條分隔線帶過 */
.kpis{gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:8px}
.stat{background:none;border:0;border-right:1px solid var(--line2);padding:16px 22px 15px}
.stat:last-child{border-right:0}
.stat .k{font:400 11.5px/1.4 var(--font-body);letter-spacing:0;color:var(--fg2);text-transform:none}
.stat .v{font:400 27px/1.1 var(--font-display);margin-top:6px;color:var(--fg)}
.stat .u{font-size:11px;color:var(--fg3);margin-top:3px}
.stat.on{background:none;color:var(--fg)}
.stat.on .k{color:var(--fg2)}
.stat.on .u{color:var(--fg3)}

/* ── 長條圖：唯一允許出現橘色的地方 ──
   注意：app.css 的 .bar 是表單頁的橘底抬頭，同名，所以要先清掉。 */
.bars{display:grid;gap:2px}
.bar{display:grid;grid-template-columns:132px 1fr 96px;gap:14px;align-items:center;
  font-size:12.5px;color:var(--fg2);padding:5px 0;background:none;position:static}
.bar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t b{font:400 10px/1 var(--font-display);margin-right:8px;color:var(--fg3)}
.bar .track{display:block;height:9px;background:var(--s2);position:relative}
.bar .fill{display:block;height:100%;min-width:2px;background:var(--fg3)}
.bar .fill.acc{background:var(--acc)}
.bar .fill.mut{background:var(--fg3)}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--fg3)}
.bar .n{font:400 11px/1.3 var(--font-display);text-align:right;white-space:nowrap;color:var(--fg2)}
.legend{font-size:11.5px;color:var(--fg3);margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:22px;height:8px;background:var(--acc);margin-right:6px;vertical-align:0}
.legend i.line{width:1px;height:12px;background:var(--fg3)}

/* ── 表格：沒有外框，只有髮絲線 ── */
table{width:100%;border-collapse:collapse;font-size:13px;background:none}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
th{font:400 11px/1.3 var(--font-body);letter-spacing:0;text-transform:none;color:var(--fg3);
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg);position:sticky;top:0}
td.num{text-align:right;font-family:var(--font-display);font-weight:400;white-space:nowrap;color:var(--fg2)}
th.num{text-align:right;white-space:nowrap}
td:last-child{white-space:nowrap}
td.big{font:400 15px/1 var(--font-display);text-align:right;color:var(--fg)}
tr.flagged td{background:none}
tr.flagged td:first-child{box-shadow:inset 2px 0 0 var(--fg)}
tbody tr:hover td{background:var(--s1)}
.scroll{overflow-x:auto;background:none;border:0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.idtag{font:400 10px/1 var(--font-display);color:var(--fg3);margin-right:9px}

/* ── 錄取總分：排名清單 ＋ 單人詳情 ── */
.split{display:grid;grid-template-columns:minmax(330px,400px) 1fr;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:18px}
.split .list{border-right:1px solid var(--line);position:sticky;top:0;align-self:start;
  height:calc(100dvh - 40px);overflow-y:auto}
.split .list button{width:100%;display:grid;grid-template-columns:26px 1fr 116px 44px;gap:12px;
  align-items:center;text-align:left;padding:11px 22px 11px 16px;border-bottom:1px solid var(--line2)}
.split .list button:hover{background:var(--s1)}
.split .list button[aria-selected="true"]{background:var(--s2)}
.split .list .no{font:400 10px/1 var(--font-display);color:var(--fg3)}
.split .list .nm{font-size:14px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split .list .nm em{font-style:normal;color:var(--fg3);font-size:11px;margin-left:8px}
.split .list .mini{display:block;height:6px;background:var(--s2)}
.split .list .mini i{display:block;height:100%;background:var(--fg3)}
.split .list button[aria-selected="true"] .mini i{background:var(--acc)}
.split .list .sc{font:400 14px/1 var(--font-display);text-align:right;color:var(--fg2)}
.split .list button[aria-selected="true"] .sc{color:var(--fg)}
.split .detail{padding:26px 40px 40px;min-width:0}
.detail .head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.detail .head h3{margin:8px 0 0;font:700 24px/1.2 var(--font-body)}
.detail .head .sub{font-size:12.5px;color:var(--fg2);margin-top:5px}
.detail .head .tot{font:400 44px/1 var(--font-display);text-align:right}
.detail .head .cap{font-size:11.5px;color:var(--fg2);margin-top:6px;text-align:right}
.detail .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;margin-top:28px}
.detail .lbl{font-size:11.5px;color:var(--fg2);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.detail .facts{display:flex;gap:26px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line2)}
.detail .facts .k{font-size:11.5px;color:var(--fg2)}
.detail .facts .v{font:400 18px/1.2 var(--font-display);margin-top:4px}
.dots{display:grid;grid-template-columns:112px 1fr 32px;gap:12px;align-items:center;font-size:12.5px;color:var(--fg2)}
.dots .d{display:flex;gap:3px}
.dots .d i{flex:1;height:8px;background:var(--s2)}
.dots .d i.on{background:var(--acc)}
.dots .n{font:400 12px/1 var(--font-display);text-align:right}
.evi{display:grid;gap:1px;background:var(--line2);margin-top:14px}
.evi div{background:var(--s1);padding:11px 14px;display:grid;grid-template-columns:96px 1fr;
  gap:14px;font-size:13px;line-height:1.6}
.evi div span{color:var(--fg3);font-size:11.5px}

/* ── 個人回饋摘要 ── */
.person{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--line);
  padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.person.flag{border-color:var(--line);border-left:3px solid var(--fg)}
.person h3{margin:0;font:500 17px/1.25 var(--font-body)}
.person .sub{font-size:11.5px;color:var(--fg3);white-space:nowrap}
.rate{display:flex;align-items:baseline;gap:8px}
.rate .big{font:400 26px/1 var(--font-display)}
.rate .cmp{font-size:11px;color:var(--fg3)}
.quotes{border-top:1px solid var(--line2);padding-top:12px;display:grid;gap:7px}
.quotes div{font-size:12.5px;line-height:1.55;color:var(--fg2);padding-left:0;border-left:0}

/* ── 標籤 ── */
.pill{display:inline-block;font:400 11px/1.3 var(--font-body);letter-spacing:0;
  padding:4px 9px;border:1px solid var(--line);color:var(--fg2);margin:0 6px 6px 0}
.pill.warn{background:none;border-color:var(--fg);color:var(--fg)}
.mate{display:inline-block;border:1px solid var(--line);padding:2px 8px;
      margin:0 6px 4px 0;font-size:11.5px;white-space:nowrap;color:var(--fg)}
.mate.taken{border-color:var(--line2);background:none;color:var(--fg3)}

/* 誰寫的：業師姓名一律標出來，同儕維持匿名 */
.quotes .src{display:block;font-size:11px;color:var(--fg3);margin-bottom:2px;letter-spacing:.02em}
.whose{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;
       border-top:1px solid var(--line2);padding-top:12px;color:var(--fg2)}
.whose span{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);padding:4px 9px}
.whose span b{font-weight:500;color:var(--fg)}
.whose .gap{border:0;padding:0;color:var(--acc)}

.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.msg{font-size:13px;padding:11px 14px;border:1px solid var(--line);background:var(--s1);margin-top:12px;line-height:1.6}
.msg.err{background:var(--s1);border-color:var(--acc)}
.warnbox{background:var(--s1);border:1px solid var(--line);color:var(--fg2);padding:16px 20px;font-size:13px;line-height:1.7}
.warnbox b{color:var(--fg);font-weight:500}
.warnbox code{background:var(--s2);color:var(--fg)}
label.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.empty{padding:60px 20px;text-align:center;color:var(--fg3);font-size:14px}
.stamp{font-size:12px;color:var(--fg2)}

/* app.css 的按鈕與輸入框在深色底上要跟著換 */
.btn{border:1px solid var(--line);background:var(--s1);color:var(--fg);font-weight:400}
.btn.primary{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.ghost{background:none;border-color:var(--line);color:var(--fg2)}
.btn.inline{padding:10px 16px;font-size:13px}
.field{border:1px solid var(--line);background:var(--s2);color:var(--fg)}
.field:focus{outline:2px solid var(--acc);outline-offset:-2px}
code{background:var(--s2);color:var(--fg2)}

@media print{
  aside.rail,.row-actions,.btn{display:none}
  html[data-theme]{--bg:#fff;--s1:#fff;--s2:#EDEDED;--line:#DDD;--line2:#EEE;--fg:#000;--fg2:#555;--fg3:#888}
  .shell{display:block}
  .split .list{display:none}
}
</style>
</head>
<body>

<div class="shell">
<aside class="rail">
  <div class="brand">
    <div class="eyebrow">TNDA 前導甄選</div>
    <h1>統計儀表板</h1>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="railfoot">
    <span id="back"></span>
    <span id="meta">尚未載入資料</span>
    <button id="theme">切換淺色</button>
  </div>
</aside>

<main class="main">
<div class="wrap">
  <section class="pane" id="pane-load">
    <h2 class="sec">載入資料</h2>
    <p class="lede">三種來源擇一，每次載入會取代目前的資料。</p>
    <div class="grid g2">
      <div class="card">
        <div class="eyebrow" style="color:var(--fg)">A — 從 Google 試算表直接抓</div>
        <p class="lede" style="margin:10px 0 12px">
          需先在 <code>config.js</code> 填好 ENDPOINT。一次抓回全部五份表單。
        </p>
        <label class="lede" style="display:block;margin-bottom:6px">讀取金鑰
          <span style="color:var(--fg3)">（apps-script.gs 裡的 READ_KEY，只存在這台裝置）</span>
        </label>
        <input type="password" class="field" id="readkey" autocomplete="off"
               placeholder="只有主辦知道的那一串字" style="margin-bottom:12px">
        <button class="btn primary inline" id="btn-fetch">抓取最新資料</button>
      </div>
      <div class="card">
        <div class="eyebrow" style="color:var(--fg)">B — 上傳 CSV</div>
        <p class="lede" style="margin:10px 0 12px">
          試算表的每個分頁「檔案 → 下載 → CSV」，可一次選多個檔。
          檔名或 <code>form</code> 欄會決定它是哪一份表單。
        </p>
        <input type="file" id="file" accept=".csv,text/csv" multiple class="field">
      </div>
    </div>
    <div id="load-msg"></div>

    <h2 class="sec">示範資料</h2>
    <p class="lede">還沒有真實資料時，先產一份假資料看看統計長什麼樣子（不會寫進試算表）。</p>
    <button class="btn ghost inline" id="btn-demo">產生示範資料</button>
  </section>

  <section class="pane hide" id="pane-score"></section>
  <section class="pane hide" id="pane-peer"></section>
  <section class="pane hide" id="pane-day2"></section>
  <section class="pane hide" id="pane-brief"></section>
  <section class="pane hide" id="pane-status"></section>
  <section class="pane hide" id="pane-roster"></section>
  <section class="pane hide" id="pane-export"></section>
</div>
</main>
</div>

<script src="config.js?v=1d165ca2"></script>
<script src="app.js?v=8aed0e3e"></script>
<script>
(() => {
'use strict';
const T = window.TNDA, A = window.APP;
const $ = (id) => document.getElementById(id), esc = A.esc;

let DATA = { peer1: [], pair1: [], mentor1: [], observe2: [], team2: [], self2: [] };
let REVEAL = false;

const TABS = [
  ['score', '錄取總分'], ['peer', 'D1 同儕訊號'], ['day2', 'D2 過程與團隊'],
  ['brief', '個人回饋摘要'], ['status', '完成度'], ['roster', '名單'],
  ['export', '匯出'], ['load', '載入資料'],
];

/* ════ 通用 ═══════════════════════════════════════════════ */
/** 一律照學員編號排——和名牌、桌牌、紙本的 NO. 是同一個順序，
 *  而且同名同姓時姓名排序會把兩個人排在一起，看起來像重複資料。 */
const byId = (a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
/** 表格與卡片上的人名前綴：編號用等寬字體壓灰，姓名維持主體。 */
const idTag = (id) => '<span class="idtag">' + esc(id) + '</span>';

const n1 = (x) => x == null ? '—' : (Math.round(x * 10) / 10).toFixed(1);
const n0 = (x) => x == null ? '—' : String(Math.round(x));
const pct = (x) => x == null ? '—' : Math.round(x * 100) + '%';

/** 一份表單的所有 1–5 面向（self 與 per 都算）。 */
function scaleFields(F) {
  return [].concat(F.self ? F.self.fields : [], F.per ? F.per.fields : [])
    .filter((f) => f.type === 'scale');
}
const FIELDS = {
  mentor1:  scaleFields(T.FORMS.mentor1),
  observe2: scaleFields(T.FORMS.observe2),
  team2:    scaleFields(T.FORMS.team2),
};

/** 一列的 0–100 分。 */
const rowScore = (formId, r) => A.weighted100(FIELDS[formId], r);

/** 把列依 key 分群。 */
function groupBy(rows, keyFn) {
  const m = {};
  rows.forEach((r) => { const k = keyFn(r); if (k) (m[k] = m[k] || []).push(r); });
  return m;
}

/* ════ 核心計算 ═══════════════════════════════════════════
   每位候選人：三個來源各自 0–100，再依 SCORING 加權。
   缺哪一份就照實說缺，不悄悄補值。 */
function computeAll() {
  const out = {};
  T.allStudentIds().forEach((id) => {
    // 這些畫面都會用 idTag 把編號印在姓名前面，所以姓名本身不用再補編號。
    out[id] = {
      id, name: T.nameOf(id), d1: T.d1GroupOf(id), team: T.d2TeamOf(id),
      parts: {}, detail: {}, flags: [], raters: {},
    };
  });

  // D1 業師評分：subject = 候選人編號，可能有多位業師
  Object.entries(groupBy(DATA.mentor1, (r) => r.subject)).forEach(([name, rows]) => {
    const p = out[name]; if (!p) return;
    const scores = rows.map((r) => rowScore('mentor1', r)).filter((x) => x != null);
    p.parts.mentor1 = A.mean(scores);
    p.raters.mentor1 = scores.length;
    p.spread = scores.length > 1 ? Math.max(...scores) - Math.min(...scores) : null;
    // 證據與追問紀錄都帶上是哪位業師寫的——合議時要問得出「這句是誰看到的」。
    p.detail.mentor1 = FIELDS.mentor1.map((f) => ({
      f, v: A.mean(rows.map((r) => Number(r[f.k])).filter(Boolean)),
      ev: rows.filter((r) => r[f.k + '_ev'])
             .map((r) => ({ by: r.submitter, text: r[f.k + '_ev'] })),
    }));
    p.notes = rows.filter((r) => r.notes).map((r) => ({ by: r.submitter, text: r.notes }));
    // 每位業師各自的總分與各面向給分，用來看差距是誰跟誰。
    p.byMentor = rows.map((r) => ({
      by: r.submitter,
      score: rowScore('mentor1', r),
      dims: FIELDS.mentor1.map((f) => Number(r[f.k]) || null),
    })).sort((a, b) => (b.score || 0) - (a.score || 0));
    rows.forEach((r) => String(r.flags || '').split('|').filter(Boolean)
      .forEach((fl) => { if (!p.flags.includes(fl)) p.flags.push(fl); }));
  });

  // D2 個人過程觀察：subject = 組員，可能有上下午兩張、多位觀察者
  Object.entries(groupBy(DATA.observe2, (r) => r.subject)).forEach(([name, rows]) => {
    const p = out[name]; if (!p) return;
    const scores = rows.map((r) => rowScore('observe2', r)).filter((x) => x != null);
    p.parts.observe2 = A.mean(scores);
    p.raters.observe2 = scores.length;
    p.detail.observe2 = FIELDS.observe2.map((f) => ({
      f, v: A.mean(rows.map((r) => Number(r[f.k])).filter(Boolean)), ev: [],
    }));
    // 具體事例也要記是誰觀察到的，還有是上午還是下午那一段。
    p.behaviour = rows.filter((r) => r.behaviour).map((r) => ({
      by: r.submitter, slot: r.slot || '', text: r.behaviour,
    }));
  });

  // D2 團隊成果：subject = 組別，Final Proposal 一組一張，套用到組內每一位。
  // 兩位 Assigned Reviewers 都填的話（一組多列）取平均。
  const teamScore = {};
  Object.entries(groupBy(DATA.team2, (r) => r.subject)).forEach(([team, rows]) => {
    const scores = rows.map((r) => rowScore('team2', r)).filter((x) => x != null);
    teamScore[team] = {
      score: A.mean(scores), n: scores.length,
      next: rows.map((r) => r.next).filter(Boolean),
      strength: rows.map((r) => r.strength).filter(Boolean),
      gap: rows.map((r) => r.gap).filter(Boolean),
    };
  });
  Object.values(out).forEach((p) => {
    if (p.team && teamScore[p.team]) {
      p.parts.team2 = teamScore[p.team].score;
      p.raters.team2 = teamScore[p.team].n;
    }
  });

  // 加權總分：只用已有的部分，並照實標示涵蓋率
  Object.values(out).forEach((p) => {
    let w = 0, acc = 0;
    T.SCORING.forEach((s) => {
      const v = p.parts[s.form];
      if (v == null) return;
      w += s.weight; acc += s.weight * v;
    });
    p.coverage = w;
    p.total = w ? acc / w : null;
  });

  return { people: out, teamScore };
}

/* 同儕訊號（peer1，0%） */
function peerAgg(group) {
  const roster = T.studentsIn(group);
  const by = {};
  roster.forEach((id) => {
    by[id] = { id, name: T.labelOf(id), received: 0, yes: 0, reasons: {}, quotes: [] };
  });
  DATA.peer1.forEach((r) => {
    const p = by[r.subject]; if (!p) return;
    p.received++;
    if (r.willing === 'Y') p.yes++;
    String(r.reasons || '').split('|').filter(Boolean)
      .forEach((c) => { p.reasons[c] = (p.reasons[c] || 0) + 1; });
    if (r.highlight) p.quotes.push(r.highlight);
  });
  Object.values(by).forEach((p) => {
    p.rate = p.received ? p.yes / p.received : null;
    p.g = p.reasons.G || 0;
    p.gShare = p.received ? p.g / p.received : 0;
  });
  return Object.values(by);
}

/* 自評 vs 他評落差（self2 + observe2，0%，自我認知訊號） */
function selfGap() {
  const out = {};
  DATA.self2.filter((r) => r.rel === 'self').forEach((r) => {
    out[r.subject] = out[r.subject] || {};
    out[r.subject].self = A.mean([Number(r.s_contrib), Number(r.s_collab)].filter(Boolean));
    out[r.subject].myPart = r.my_part; out[r.subject].doDiff = r.do_diff;
  });
  Object.entries(groupBy(DATA.self2.filter((r) => r.rel === 'peer'), (r) => r.subject))
    .forEach(([id, rows]) => {
      out[id] = out[id] || {};
      out[id].byPeers = A.mean(rows.flatMap((r) =>
        [Number(r.p_contrib), Number(r.p_collab)].filter(Boolean)));
      out[id].evidence = rows.map((r) => r.p_evidence).filter(Boolean);
    });
  Object.values(out).forEach((o) => {
    o.gap = (o.self != null && o.byPeers != null) ? o.self - o.byPeers : null;
  });
  return out;
}

/* 分組用：先看「選兩位最想同組的人」的互選，那是硬配對；
   同儕評價的雙向 Y 只是備援參考，因為一個人可以對很多人說 Y。 */
function pairingHTML() {
  let h = '';

  const pick = {};   // 誰選了哪兩位
  DATA.pair1.forEach((r) => {
    const xs = [r.choice, r.choice2].filter(Boolean);
    if (xs.length) pick[r.submitter] = xs;
  });
  const submitted = Object.keys(pick);
  const chose = (a, b) => (pick[a] || []).indexOf(b) >= 0;

  /* 每人選兩位，所以最強的訊號是「三人全互選」：三個人互相都把彼此
     選進自己的兩位裡（每人只有兩個位子，所以六個方向全部成立）——
     這就是一組完整的隊，先取。照編號順序取，取過的不再參與，
     結果才會是穩定的，重跑一次不會換一組人。 */
  const paired = new Set();
  const trios = [];
  const ordered = submitted.slice().sort();
  ordered.forEach((a) => {
    if (paired.has(a)) return;
    const [x, y] = pick[a] || [];
    if (!x || !y || paired.has(x) || paired.has(y)) return;
    if (chose(x, a) && chose(x, y) && chose(y, a) && chose(y, x)) {
      trios.push([a, x, y].sort());
      paired.add(a); paired.add(x); paired.add(y);
    }
  });

  /* 剩下的人再看兩人互選，先湊成對，第三人從「還沒配到」牽線。 */
  const matched = [];
  ordered.forEach((a) => {
    if (paired.has(a)) return;
    const b = (pick[a] || []).find((x) => !paired.has(x) && x !== a && chose(x, a));
    if (b) { matched.push([a, b]); paired.add(a); paired.add(b); }
  });
  const unpaired = T.allStudentIds().filter((id) => !paired.has(id));

  h += '<h2 class="sec">三人全互選　' + trios.length + ' 組</h2>' +
    '<p class="lede">三個人互相都把彼此選進自己的兩位裡——這已經是一組完整的隊，直接定案。' +
    '已交 <b>' + submitted.length + '</b> / ' + T.allStudentIds().length + ' 人。</p>' +
    (trios.length
      ? '<div class="card"><div class="grid g3">' + trios.map((t) =>
          '<div style="border:1px solid var(--acc);background:var(--s1);padding:10px 12px;font-size:13.5px">' +
          t.map((i) => esc(T.labelOf(i))).join('　⇄　') + '</div>').join('') + '</div></div>'
      : '<div class="card"><span class="sub">還沒有三人全互選的組。</span></div>');

  // 兩人成對後還缺第三人——「還沒配到、而且兩位都選了」的人是現成人選。
  const thirdFor = ([a, b]) => T.allStudentIds()
    .filter((u) => !paired.has(u) && u !== a && u !== b && chose(u, a) && chose(u, b));

  h += '<h2 class="sec">兩人互選　' + matched.length + ' 對</h2>' +
    '<p class="lede">兩個人互相把對方選進自己的兩位裡，先湊成對；' +
    '第三人從「還沒配到」裡牽線——卡片下面若列出人名，是<b>兩位都選了他們</b>的現成人選。</p>' +
    (matched.length
      ? '<div class="card"><div class="grid g3">' + matched.map(([a, b]) => {
          const cand = thirdFor([a, b]);
          return '<div style="border:1px solid var(--line);background:var(--s1);padding:10px 12px;font-size:13.5px">' +
            esc(T.labelOf(a)) + '　⇄　' + esc(T.labelOf(b)) +
            (cand.length ? '<div style="font-size:12px;color:var(--fg2);margin-top:5px">＋想加入：' +
              cand.map((i) => esc(T.labelOf(i))).join('、') + '</div>' : '') + '</div>';
        }).join('') + '</div></div>'
      : '<div class="card"><span class="sub">還沒有兩人互選的配對。</span></div>');

  // 被幾個人選到（兩個位子都算）。單向選擇不另開一區，併進下表當一欄，
  // 否則每人一格會排掉整個螢幕。
  const nominated = {};
  submitted.forEach((a) => {
    (pick[a] || []).forEach((b) => { nominated[b] = (nominated[b] || 0) + 1; });
  });

  h += '<h2 class="sec">還沒配到　' + unpaired.length + ' 人</h2>' +
    '<p class="lede">這些人由主辦幫忙編組。' +
    '「他選了誰」旁邊是對方目前的狀態，湊組時可以參考——<b>不要在台上唸出來</b>。' +
    '「被選次數」高又還沒配到的人，通常是最好牽線的對象。</p>' +
    '<div class="scroll"><table><thead><tr><th>編號／姓名</th>' +
    '<th class="num">被選次數</th><th>他選的兩位</th><th>那兩位的狀態</th><th>理由</th>' +
    '</tr></thead><tbody>' +
    unpaired.map((id) => {
      const targets = pick[id] || [];
      const why = (DATA.pair1.find((r) => r.submitter === id) || {}).why || '';
      const stateOf = (t) => paired.has(t) ? '已配對'
        : !pick[t] ? '還沒交'
        : chose(t, id) ? '也選了他' : '可以牽線';
      return '<tr><td>' + idTag(id) + '<b>' + esc(T.nameOf(id)) + '</b></td>' +
        '<td class="num">' + (nominated[id] || 0) + '</td>' +
        '<td>' + (targets.length
          ? targets.map((t) => esc(T.labelOf(t))).join('<br>')
          : '<i style="color:var(--fg3)">未交</i>') + '</td>' +
        '<td style="font-size:12.5px">' +
          targets.map(stateOf).map(esc).join('<br>') + '</td>' +
        '<td style="font-size:12.5px">' + esc(why) + '</td></tr>';
    }).join('') + '</tbody></table></div>';

  // 備援：同儕評價的雙向 Y。一個人可以對很多人說「想」，所以配對數會很多——
  // 一對一格會排出上百格，改成一人一列、對象收在同一格。
  h += '<h2 class="sec">備援參考：同儕評價的雙向「想一起做」</h2>' +
    '<p class="lede">同儕評價一個人可以對很多位都說「想一起做」，所以這裡不是「一人一組」，' +
    '而是<b>每個人所有互相有意願的對象</b>。<b>湊不出三人時，從當事人那一列挑一個還沒配到的。</b>' +
    '「互選數 0」的人要優先幫他牽線。</p>';

  T.d1Groups().forEach((g) => {
    const yes = new Set(DATA.peer1
      .filter((r) => r.willing === 'Y' && T.d1GroupOf(r.subject) === g)
      .map((r) => r.submitter + '→' + r.subject));
    const rows = T.studentsIn(g).map((id) => ({
      id,
      mates: T.studentsIn(g).filter((o) =>
        o !== id && yes.has(id + '→' + o) && yes.has(o + '→' + id)),
    }));
    h += '<h2 class="sec" style="border-bottom-width:1px">' + esc(g) + '</h2>' +
      '<div class="scroll"><table><thead><tr><th>編號／姓名</th><th class="num">互選數</th>' +
      '<th>互相想一起做的人</th></tr></thead><tbody>' +
      rows.map((r) => '<tr class="' + (r.mates.length ? '' : 'flagged') + '">' +
        '<td>' + idTag(r.id) + '<b>' + esc(T.nameOf(r.id)) + '</b></td>' +
        '<td class="num">' + r.mates.length + '</td>' +
        '<td style="font-size:12.5px;line-height:1.9">' +
          (r.mates.length
            ? r.mates.map((m) => '<span class="mate' + (paired.has(m) ? ' taken' : '') + '">' +
                esc(T.labelOf(m)) + '</span>').join('')
            : '<i style="color:var(--fg3)">沒有互選對象</i>') +
        '</td></tr>').join('') + '</tbody></table></div>';
  });

  h += '<p class="lede" style="margin-top:10px">' +
    '<span class="mate">白底</span>＝還沒配到，可以牽線　' +
    '<span class="mate taken">灰底</span>＝已經在別組了</p>';

  return h;
}

/* ── D2 過程與團隊 ─────────────────────────────────────── */
function renderDay2() {
  const p = $('pane-day2');
  if (!DATA.observe2.length && !DATA.team2.length && !DATA.self2.length)
    return void (p.innerHTML = '<div class="empty">還沒有 Day2 資料。</div>');
  const { people, teamScore } = computeAll();
  let h = '';

  if (DATA.team2.length) {
    const teams = Object.keys(teamScore).sort();
    const max = 100;
    h += '<h2 class="sec">團隊成果（15%）</h2>' +
      '<p class="lede">Final Proposal 一組一張，套用到組內每一位成員；' +
      '同一組的成員這一項分數相同。兩位 Assigned Reviewers 都填的話取平均。</p>' +
      '<div class="card"><div class="bars">' +
      teams.map((t) => barRow(t + '　' + T.teamMembers(t).map(T.labelOf).join('、'),
        (teamScore[t].score || 0) / max, n1(teamScore[t].score),
        'acc')).join('') + '</div></div>';

    h += '<h2 class="sec">各面向</h2>' +
      '<p class="lede">面向對齊題目《新鬥士參戰》：本質 → 操作 → 取捨 → 呈現。' +
      '一組多列＝不同評審各填了一張。</p>' +
      '<div class="scroll"><table><thead><tr><th>組別</th><th>來源角色</th>' +
      FIELDS.team2.map((f) => '<th class="num">' + esc(f.label) + '<br>' + f.weight + '%</th>').join('') +
      '<th class="num">加權</th><th>若多兩小時，先改什麼</th></tr></thead><tbody>' +
      teams.map((t) => DATA.team2.filter((r) => r.subject === t)
        .map((r) => '<tr><td><b>' + esc(t) + '</b></td>' +
          '<td style="font-size:12.5px">' + esc(r.character || '—') + '</td>' +
          FIELDS.team2.map((f) => '<td class="num">' + n1(Number(r[f.k]) || null) + '</td>').join('') +
          '<td class="big">' + n1(rowScore('team2', r)) + '</td>' +
          '<td style="font-size:12.5px">' + esc(r.next || '') + '</td></tr>').join('')
      ).join('') + '</tbody></table></div>';
  }

  if (DATA.observe2.length) {
    h += '<h2 class="sec">個人過程觀察（30%，主要訊號）</h2>' +
      '<p class="lede">六個 Lens（READ／DECONSTRUCT／DIVERGE／DECIDE／COLLABORATE／ADAPT）加權平均。' +
      '同一人若有上午與下午兩張、或多位觀察者，取平均。</p>' +
      '<div class="scroll"><table><thead><tr><th>候選人</th><th>D2 組</th>' +
      FIELDS.observe2.map((f) => '<th class="num">' + esc(f.label) + '</th>').join('') +
      '<th class="num">加權</th><th class="num">筆數</th></tr></thead><tbody>' +
      Object.values(people).filter((x) => x.parts.observe2 != null)
        .sort(byId).map((x) =>
        '<tr><td>' + idTag(x.id) + '<b>' + esc(x.name) + '</b></td><td>' + esc(x.team) + '</td>' +
        x.detail.observe2.map((d) => '<td class="num">' + n1(d.v) + '</td>').join('') +
        '<td class="big">' + n1(x.parts.observe2) + '</td>' +
        '<td class="num">' + x.raters.observe2 + '</td></tr>').join('') +
      '</tbody></table></div>';
  }

  if (DATA.self2.length) {
    const gaps = selfGap();
    const rows = Object.entries(gaps).filter(([id, o]) => o.gap != null && T.isKnown(id))
      .sort((a, b) => Math.abs(b[1].gap) - Math.abs(a[1].gap));
    h += '<h2 class="sec">自評 vs 隊友評（0%，自我認知訊號）</h2>' +
      '<p class="lede">兩者都是 1–5。差距為正代表<b>自評高於隊友評</b>，為負代表低估自己。' +
      '這一欄不進總分，但和 D1「自我認知與成長性」那一項對照著看很有用：' +
      '<b>±1.0 以上值得在合議時提出來</b>，差距本身不是缺點，說不出理由才是。</p>' +
      '<div class="scroll"><table><thead><tr><th>候選人</th><th class="num">自評</th>' +
      '<th class="num">隊友評</th><th class="num">差距</th><th>隊友寫的具體事例</th>' +
      '</tr></thead><tbody>' +
      rows.map(([id, o]) => '<tr class="' + (Math.abs(o.gap) >= 1 ? 'flagged' : '') + '">' +
        '<td>' + idTag(id) + '<b>' + esc(T.nameOf(id)) + '</b></td>' +
        '<td class="num">' + n1(o.self) + '</td>' +
        '<td class="num">' + n1(o.byPeers) + '</td>' +
        '<td class="num">' + (o.gap > 0 ? '+' : '') + n1(o.gap) + '</td>' +
        '<td style="font-size:12.5px">' + esc((o.evidence || []).join(' / ')) + '</td></tr>').join('') +
      '</tbody></table></div>';
  }

  p.innerHTML = h;
}

/* ── 個人回饋摘要 ──────────────────────────────────────── */
function renderBrief() {
  const p = $('pane-brief');
  if (!hasAny()) return void (p.innerHTML = empty());
  const { people, teamScore } = computeAll();
  const gaps = selfGap();

  let h = '<h2 class="sec">個人回饋摘要</h2>' +
    '<p class="lede">每位候選人一張，對應紙本「個人回饋摘要」那一頁。' +
    '左側白線＝有需要業師主動處理的訊號。<b>業師寫的每一句都標了是誰寫的</b>，' +
    '合議時問得出「這句是誰看到的」；<b>同儕亮點句一律匿名</b>，那是對學員的承諾。</p>' +
    '<div class="row-actions"><button class="btn primary inline" id="brief-text">' +
    '產生全部文字（可貼進回饋單）</button>' +
    '<label class="sw"><input type="checkbox" id="brief-anon"> 文字裡不要標業師姓名</label>' +
    '<span class="stamp">要發給候選人時可以勾起來</span></div><div id="brief-out"></div>';

  h += '<div class="grid g2" style="margin-top:20px">';
  Object.values(people).sort(byId).forEach((x) => {
    const peer = peerOf(x.id);
    const gp = gaps[x.id] || {};
    const lowExp = peer && peer.received && peer.gShare >= 0.3;
    const flag = x.flags.some((f) => f !== 'STAR') || lowExp || Math.abs(gp.gap || 0) >= 1;

    h += '<div class="person' + (flag ? ' flag' : '') + '">' +
      '<div><h3>' + idTag(x.id) + esc(x.name) + '</h3><span class="sub">' +
      esc(x.d1) + (x.team ? '　·　' + esc(x.team) : '') + '</span></div>' +
      '<div class="rate"><span class="big">' + n1(x.total) + '</span>' +
      '<span class="cmp">加權總分（已計入 ' + Math.round((x.coverage || 0) * 100) + '%）</span></div>';

    h += '<div class="bars">' + T.SCORING.map((s) =>
      barRow(s.label, (x.parts[s.form] || 0) / 100, n1(x.parts[s.form]), 'acc')).join('') + '</div>';

    if (x.detail.mentor1) {
      h += '<div class="bars" style="border-top:1px solid var(--line2);padding-top:12px">' +
        x.detail.mentor1.map((d) => barRow(d.f.label, (d.v || 0) / 5, n1(d.v) + ' / 5', 'mut')).join('') +
        '</div>';
      // 兩位以上業師評到同一個人時，列出各自的總分——差距是誰跟誰，一眼看到。
      if ((x.byMentor || []).length > 1) {
        h += '<div class="whose">' + x.byMentor.map((m) =>
          '<span><b>' + esc(T.nameOf(m.by)) + '</b>' + n1(m.score) + '</span>').join('') +
          (x.spread != null ? '<span class="gap">差距 ' + n1(x.spread) + '</span>' : '') + '</div>';
      }
    }

    const pills = x.flags.map((f) => '<span class="pill' + (f === 'STAR' ? '' : ' warn') + '">' +
      esc(FLAG_LABEL[f] || f) + '</span>').join('') +
      (lowExp ? '<span class="pill warn">同儕曝光不足 G ' + peer.g + '</span>' : '') +
      (Math.abs(gp.gap || 0) >= 1 ? '<span class="pill warn">自評落差 ' +
        (gp.gap > 0 ? '+' : '') + n1(gp.gap) + '</span>' : '');
    if (pills) h += '<div>' + pills + '</div>';

    // 業師寫的都標名字；同儕的一律匿名（對學員的承諾）。
    const quotes = [].concat(
      (x.detail.mentor1 || []).flatMap((d) =>
        d.ev.map((e) => ({ who: T.nameOf(e.by), what: d.f.label, text: e.text }))),
      (x.notes || []).map((n) => ({ who: T.nameOf(n.by), what: '追問紀錄', text: n.text })),
      (x.behaviour || []).map((b) => ({
        who: T.nameOf(b.by), what: 'D2 過程' + (b.slot ? '·' + b.slot : ''), text: b.text })),
      (peer ? peer.quotes : []).map((q) => ({ who: '', what: '同儕（匿名）', text: q })));
    if (quotes.length) {
      h += '<div class="quotes">' + quotes.slice(0, 10).map((q) =>
        '<div><span class="src">' + (q.who ? esc(q.who) + '　' : '') + esc(q.what) + '</span>' +
        esc(q.text) + '</div>').join('') + '</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  p.innerHTML = h;

  $('brief-text').onclick = () => {
    // 勾了就不標業師姓名——要發給候選人時用。
    const anon = $('brief-anon').checked;
    const by = (id) => anon ? '' : '（' + T.nameOf(id) + '）';
    let t = '';
    Object.values(people).sort(byId).forEach((x) => {
      if (x.total == null) return;
      const peer = peerOf(x.id);
      t += '════ ' + x.id + '　' + x.name + '　' + x.d1 + (x.team ? ' / ' + x.team : '') + ' ════\n' +
        '加權總分 ' + n1(x.total) + '（已計入 ' + Math.round(x.coverage * 100) + '%）\n' +
        T.SCORING.map((s) => '  ' + s.label + ' ' + n1(x.parts[s.form])).join('\n') + '\n';
      if (!anon && (x.byMentor || []).length > 1) {
        t += '\n【各業師給分】\n' +
          x.byMentor.map((m) => '  ' + T.nameOf(m.by) + ' ' + n1(m.score)).join('\n') +
          (x.spread != null ? '\n  差距 ' + n1(x.spread) : '') + '\n';
      }
      if (x.detail.mentor1) {
        t += '\n【D1 各面向 1–5】\n' +
          x.detail.mentor1.map((d) => '  ' + d.f.label + ' ' + n1(d.v) +
            (d.ev.length
              ? '\n' + d.ev.map((e) => '      證據' + by(e.by) + '：' + e.text).join('\n')
              : '')).join('\n') + '\n';
      }
      if ((x.notes || []).length) {
        t += '\n【追問紀錄】\n' + x.notes.map((n) => '  · ' + by(n.by) + n.text).join('\n') + '\n';
      }
      if (peer && peer.received) {
        const top = Object.entries(peer.reasons).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([c]) => c);
        t += '\n【同儕訊號（不計分，匿名）】\n  ' + peer.yes + '/' + peer.received +
          ' 位同組同學表示想一起工作，最常指認：' + top.join('、') + '\n' +
          (peer.quotes.length ? peer.quotes.map((q) => '  · ' + q).join('\n') + '\n' : '');
      }
      if (x.behaviour && x.behaviour.length) {
        t += '\n【D2 過程觀察到的具體行為】\n' +
          x.behaviour.map((b) => '  · ' + (b.slot ? b.slot + '　' : '') + by(b.by) + b.text).join('\n') + '\n';
      }
      if (x.team && teamScore[x.team]) {
        t += '\n【D2 團隊】' + x.team + '　' + n1(teamScore[x.team].score) + '\n' +
          (teamScore[x.team].next.length ? '  下一步：' + teamScore[x.team].next.join(' / ') + '\n' : '');
      }
      t += '\n\n';
    });
    $('brief-out').innerHTML = '<textarea class="field" style="min-height:420px;margin-top:16px;' +
      'font:400 12px/1.6 ui-monospace,Menlo,monospace"></textarea>';
    $('brief-out').querySelector('textarea').value = t;
  };
}
let PEER_CACHE = null;
function peerOf(id) {
  if (!PEER_CACHE) {
    PEER_CACHE = {};
    T.d1Groups().forEach((g) => peerAgg(g).forEach((x) => { PEER_CACHE[x.id] = x; }));
  }
  return PEER_CACHE[id];
}

      'placeholder="王小明&#10;陳怡君&#10;…"></textarea>' +
    '<div class="row-actions"><button class="btn inline" id="rs-fill">填進表格</button></div>' +

    '<h2 class="sec">逐一確認</h2>' +
    '<div class="warnbox"><b>只能改姓名，不能改編號。</b>編號是所有資料的鍵——' +
    '同儕評價、評分表、分組全部靠它串起來，改了等於換一個人，已收的資料會對不上。' +
    '要換人或調分組，請改 <code>config.js</code> 並重新上架。</div>' +
    '<div class="row-actions">' +
      '<button class="btn primary inline" id="rs-save">儲存到試算表</button>' +
      '<button class="btn ghost inline" id="rs-reset">還原這一頁的修改</button>' +
      '<span class="stamp" id="rs-msg"></span>' +
    '</div>' +
    '<div class="scroll" style="margin-top:14px"><table><thead><tr>' +
    '<th>編號</th><th>姓名</th><th>D1 組</th><th>D2 組</th></tr></thead><tbody>' +
    T.STUDENTS.map((s) => row(s.id,
      '<td>' + esc(s.d1 || '') + '</td><td>' + esc(s.d2 || '') + '</td>')).join('') +
    '</tbody></table></div>' +

    '<h2 class="sec">業師</h2>' +
    '<p class="lede">兩天的業師不同人，表單頁只會列出當天出席的那幾位。' +
    '要加減人或改出席天數是改 <code>config.js</code> 的 <code>MENTORS</code>；' +
    '這一頁只改姓名。同一個人兩天都來就只給一個編號、<code>days: [1, 2]</code>。</p>' +
    '<div class="scroll"><table><thead><tr><th>編號</th><th>姓名</th><th>出席</th></tr></thead><tbody>' +
    T.MENTORS.map((m) => row(m.id,
      '<td>' + T.daysOfMentor(m.id).map((d) => 'DAY ' + d).join('、') + '</td>')).join('') +
    '</tbody></table></div>';

  const inputs = () => [...p.querySelectorAll('input[data-id]')];
  const msg = (t) => { $('rs-msg').textContent = t; };

  $('rs-fill').onclick = () => {
    const lines = $('rs-bulk').value.split('\n').map((s) => s.trim()).filter(Boolean);
    if (!lines.length) return msg('貼上的內容是空的。');
    // 只填學員，業師那幾格自己打——順序對不上時比較不會出事。
    const stu = inputs().filter((el) => T.person(el.dataset.id).role === 'student');
    lines.slice(0, stu.length).forEach((nm, i) => { stu[i].value = nm; });

    /* 行數對不上時要講清楚「系統認為有幾位」——最常見的原因不是貼錯，
       而是這台裝置讀到了快取的舊 config.js（人數還是上一版）。
       只說「多出來的 N 行忽略」會讓人以為是自己貼錯。 */
    if (lines.length === stu.length) {
      msg('填了 ' + lines.length + ' 個名字。請對一下編號有沒有跑掉，再按儲存。');
    } else {
      msg('⚠ 你貼了 ' + lines.length + ' 行，但系統目前只有 ' + stu.length + ' 位學員' +
        (lines.length > stu.length
          ? '，多出來的 ' + (lines.length - stu.length) + ' 行被忽略了。'
          : '，還有 ' + (stu.length - lines.length) + ' 格是空的。') +
        ' 如果人數應該是 ' + lines.length + '，代表這台裝置讀到的是舊版設定——' +
        '請強制重新整理（Cmd/Ctrl + Shift + R）再貼一次。');
    }
  };

  $('rs-reset').onclick = () => { renderRoster(); msg('已還原成目前生效的名單。'); };
  /* 可以分次存。名單是陸續到齊的——業師先確定、學員名單後到、人數還會變。
     後端是合併寫入，所以只送有填的那幾筆不會清掉之前存過的。 */
  $('rs-save').onclick = async () => {
    const map = {};
    let blank = 0;
    inputs().forEach((el) => {
      const v = el.value.trim();
      if (!v) { blank++; return; }
      map[el.dataset.id] = v;
    });
    if (!Object.keys(map).length) {
      return msg('一格都沒填，沒有東西可以存。');
    }
    msg('儲存中…');
    try {
      await A.saveNames(map);
      PEER_CACHE = null;
      renderRoster();
      msg('已存 ' + Object.keys(map).length + ' 筆到試算表。' +
        (blank ? '還有 ' + blank + ' 格沒填，那幾位在各頁會顯示編號；'
               + '之後填好再按一次儲存就好，不會蓋掉這次存的。'
               : '名單齊全，其他裝置下次開啟就會更新。'));
    } catch (err) {
      msg('存檔失敗：' + (err.message || err));
    }
  };
}

/* ── 匯出 ──────────────────────────────────────────────── */
function renderExport() {
  const p = $('pane-export');
  if (!hasAny()) return void (p.innerHTML = empty());
  p.innerHTML = '<h2 class="sec">匯出</h2>' +
    '<p class="lede">「總分表」給合議會議；「原始資料」是備份，欄位與試算表一致。</p>' +
    '<div class="row-actions">' +
    '<button class="btn primary inline" id="ex-score">下載總分表 CSV</button>' +
    Object.keys(DATA).filter((k) => DATA[k].length).map((k) =>
      '<button class="btn ghost inline" data-raw="' + k + '">' + k + ' 原始資料</button>').join('') +
    '</div>';

  $('ex-score').onclick = () => {
    const { people } = computeAll();
    const head = ['編號', '候選人', 'D1組', 'D2組'].concat(
      T.SCORING.map((s) => s.label + ' ' + Math.round(s.weight * 100) + '%'),
      ['業師差距', '已計入', '加權總分', '旗標', '同儕想一起', '自評落差']);
    const gaps = selfGap();
    const rows = Object.values(people).sort(byId)
      .map((x) => {
        const pr = peerOf(x.id), gp = gaps[x.id] || {};
        return [x.id, T.nameOf(x.id), x.d1, x.team].concat(
          T.SCORING.map((s) => n1(x.parts[s.form])),
          [x.spread == null ? '' : n1(x.spread), Math.round((x.coverage || 0) * 100) + '%',
           n1(x.total), x.flags.map((f) => FLAG_LABEL[f] || f).join(' '),
           pr && pr.received ? pr.yes + '/' + pr.received : '',
           gp.gap == null ? '' : n1(gp.gap)]);
      });
    A.download('tnda_總分表.csv', A.toCSV(head, rows));
  };
  p.querySelectorAll('[data-raw]').forEach((b) => {
    b.onclick = () => {
      const k = b.dataset.raw;
      const cols = A.columnsOf(T.FORMS[k]);
      A.download(k + '_raw.csv', A.toCSV(cols, DATA[k].map((r) => cols.map((c) => r[c]))));
    };
  });
}

/* ════ 載入 ═══════════════════════════════════════════════ */
function setData(d, source) {
  Object.keys(DATA).forEach((k) => { DATA[k] = (d[k] || []).map(norm); });
  PEER_CACHE = null;
  const n = Object.values(DATA).reduce((a, b) => a + b.length, 0);
  $('meta').innerHTML = esc(source) + '<br>' + n + ' 列　·　' +
    Object.keys(DATA).filter((k) => DATA[k].length).join(' / ');
  go('score');
}
/** 欄位一律轉字串，數值欄由 Number() 在計算時處理。 */
function norm(r) {
  const o = {};
  Object.keys(r).forEach((k) => { o[k] = r[k] == null ? '' : r[k]; });
  return o;
}

$('readkey').value = A.readKey.get();
$('readkey').oninput = () => A.readKey.set($('readkey').value);

$('btn-fetch').onclick = async () => {
  const msg = (cls, t) => { $('load-msg').innerHTML = '<div class="msg ' + cls + '">' + esc(t) + '</div>'; };
  if (!T.ENDPOINT) return msg('err', 'config.js 的 ENDPOINT 還沒填。');
  msg('', '抓取中…');
  try {
    setData(await A.fetchAll(), '來源：Google 試算表');
  } catch (err) {
    msg('err', '抓取失敗：' + (err.message || err) +
      '。若是瀏覽器跨網域限制，改用試算表「檔案 → 下載 → CSV」後在右邊上傳。');
  }
};

$('file').onchange = (e) => {
  const files = [...e.target.files];
  if (!files.length) return;
  const acc = {};
  let left = files.length;
  files.forEach((f) => {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const t = A.parseCSV(String(fr.result).replace(/^﻿/, '').trim());
        const head = t[0].map((x) => x.trim());
        t.slice(1).filter((r) => r.length > 1).forEach((r) => {
          const o = {};
          head.forEach((hk, i) => { o[hk] = r[i]; });
          // 表單名稱優先看 form 欄，沒有就看檔名
          const id = o.form || Object.keys(DATA).find((k) => f.name.indexOf(k) >= 0);
          if (id && DATA[id] !== undefined) (acc[id] = acc[id] || []).push(o);
        });
      } catch (err) { /* 略過壞掉的檔 */ }
      if (--left === 0) {
        setData(acc, '來源：' + files.map((x) => x.name).join('、'));
        $('load-msg').innerHTML = '<div class="msg">載入 ' +
          Object.keys(acc).map((k) => k + ' ' + acc[k].length + ' 列').join('、') + '。</div>';
      }
    };
    fr.readAsText(f, 'utf-8');
  });
};

/* ── 示範資料 ──────────────────────────────────────────── */
$('btn-demo').onclick = () => {
  let seed = 20260807;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const sc = (bias) => Math.max(1, Math.min(5, Math.round(bias + (rnd() - .5) * 1.8)));
  const QUOTES = ['把玩家卡關的地方講得很具體', '會主動幫別人補說明', '對自己作品的缺點很誠實',
    '節奏設計的取捨講得清楚', '示範時整組都聽懂了', '被追問時沒有硬拗'];
  const EV = ['講得出另一個選項為何不採用', '拿得出前後兩版的差異', '被問到假設時主動標出來',
    '示範時能即時改參數', '把限制卡直接寫進機制'];
  const d = { peer1: [], pair1: [], mentor1: [], observe2: [], team2: [], self2: [] };
  // 兩天的業師不同人，示範資料也要分開，不然統計看起來會跟現場不一樣。
  const M1 = T.mentorIdsForDay(1), M2 = T.mentorIdsForDay(2);
  const base = {};
  T.allStudentIds().forEach((id, i) => { base[id] = 2.4 + (i % 7) * 0.35; });
  // 補上兩個姓名欄，讓示範資料的形狀跟真表單送出來的完全一樣。
  const named = (o) => Object.assign(o, {
    submitter_name: T.nameOf(o.submitter),
    subject_name: T.isKnown(o.subject) ? T.nameOf(o.subject) : o.subject,
  });

  // peer1
  T.d1Groups().forEach((g) => {
    const roster = T.studentsIn(g);
    roster.forEach((rater, ri) => {
      if (ri % 9 === 4) return;
      roster.filter((id) => id !== rater).forEach((target) => {
        const y = rnd() < (base[target] - 1.6) / 3;
        const pool = y ? ['A', 'B', 'C', 'D', 'E', 'F'] : ['G', 'G', 'H', 'C'];
        const rs = [pick(pool)]; if (rnd() < .5) { const x = pick(pool); if (x !== rs[0]) rs.push(x); }
        d.peer1.push(named({ form: 'peer1', submitter: rater, subject: target, rel: '',
          willing: y ? 'Y' : 'N', reasons: rs.join('|'),
          highlight: y && rnd() < .3 ? pick(QUOTES) : '' }));
      });
    });
  });
  // pair1：每人選一位。刻意讓一部分互選成功、一部分單向、少數未交。
  T.allStudentIds().forEach((id, i) => {
    if (i % 11 === 5) return;                       // 少數人沒交
    const pool = T.allStudentIds().filter((x) => x !== id);
    // 前幾對刻意互選：01↔02、03↔04…；其餘隨機，製造單向與未配對
    const idx = T.allStudentIds().indexOf(id);
    const partner = idx < 12 ? T.allStudentIds()[idx % 2 === 0 ? idx + 1 : idx - 1] : pick(pool);
    d.pair1.push(named({ form: 'pair1', submitter: id, subject: id, rel: '',
      choice: partner,
      choice2: pick(T.allStudentIds().filter((x) => x !== id && x !== partner)),
      why: rnd() < .4 ? pick(EV) : '' }));
  });
  // mentor1（兩位業師各評一半，少數重疊）
  T.allStudentIds().forEach((id, i) => {
    [M1[i % M1.length]].concat(i % 5 === 0 ? [M1[(i + 1) % M1.length]] : []).forEach((m) => {
      const r = named({ form: 'mentor1', submitter: m, subject: id, rel: '', candidate: id,
        notes: '追問三題都問過。', flags: rnd() < .12 ? pick(['BORDER', 'ATTRIB', 'STAR']) : '' });
      FIELDS.mentor1.forEach((f) => { r[f.k] = sc(base[id]); r[f.k + '_ev'] = rnd() < .5 ? pick(EV) : ''; });
      d.mentor1.push(r);
    });
  });
  // observe2 + team2 + self2
  T.d2Teams().forEach((t, ti) => {
    const members = T.teamMembers(t);
    T.FORMS.observe2.head.find((f) => f.k === 'slot').options.forEach((slot) => {
      members.forEach((id) => {
        const r = named({ form: 'observe2', submitter: M2[ti % M2.length], subject: id, rel: '',
          team: t, slot, behaviour: rnd() < .5 ? pick(EV) : '' });
        FIELDS.observe2.forEach((f) => { r[f.k] = sc(base[id]); });
        d.observe2.push(r);
      });
    });
    // Final Proposal 一組一張；示範兩位 Assigned Reviewers 都填了。
    [0, 1].forEach((ri) => {
      const tb = 2.6 + (ti % 5) * 0.4;
      const r = named({ form: 'team2', submitter: M2[(ti + ri) % M2.length], subject: t, rel: '',
        team: t, character: pick(['嘎抓', '路易吉的吸塵器', '動森狸克', '薩爾達傳說的雞']),
        strength: '本質抓得準', gap: '操作轉化還淺', next: pick(EV) });
      FIELDS.team2.forEach((f) => { r[f.k] = sc(tb); r[f.k + '_ev'] = ''; });
      d.team2.push(r);
    });
    members.forEach((me) => {
      d.self2.push(named({ form: 'self2', submitter: me, subject: me, rel: 'self',
        s_contrib: sc(base[me] + (rnd() < .3 ? 1.2 : 0)), s_collab: sc(base[me] + .3),
        my_part: '負責機制與數值', do_diff: '會更早做測試' }));
      members.filter((id) => id !== me).forEach((id) => {
        d.self2.push(named({ form: 'self2', submitter: me, subject: id, rel: 'peer',
          p_contrib: sc(base[id]), p_collab: sc(base[id] + .2), p_evidence: pick(EV) }));
      });
    });
  });
  setData(d, '來源：示範資料（非真實）');
};

/* ── 深淺色 ────────────────────────────────────────────
   預設深色（現場一整天盯著看）。切換只存在這台裝置。 */
(() => {
  const KEY = 'tnda_dash_theme';
  const set = (v) => {
    document.documentElement.dataset.theme = v;
    $('theme').textContent = v === 'dark' ? '切換淺色' : '切換深色';
  };
  let cur = 'dark';
  try { cur = localStorage.getItem(KEY) || 'dark'; } catch (e) { /* 無痕模式 */ }
  set(cur);
  $('theme').onclick = () => {
    cur = cur === 'dark' ? 'light' : 'dark';
    set(cur);
    try { localStorage.setItem(KEY, cur); } catch (e) { /* 略過 */ }
  };
})();

A.guard(document.body);
A.mountBack($('back'), 'staff.html', '業師入口');
A.nameNotice(document.body);
A.syncNames().then(() => {
  A.nameNotice(document.body);
  PEER_CACHE = null;
  const active = [...document.querySelectorAll('nav.tabs button')]
    .find((b) => b.getAttribute('aria-selected') === 'true');
  if (active) active.click();
});
renderTabs('load');
})();
